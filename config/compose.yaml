services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_ADMIN_PASSWORD:?Set SQL_ADMIN_PASSWORD in the local .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - fde_sql_data:/var/opt/mssql
    restart: "no"
volumes:
  fde_sql_data:
